[versions]
kotlin = "1.9.23"
kotlinx-serialization = "1.6.3"
kotlinx-coroutines = "1.8.0"
agp = "8.5.2"
compose-bom = "2024.06.00"
wear-compose = "1.4.0"
activity-compose = "1.9.0"
okhttp = "4.12.0"
tiles = "1.4.0"
protolayout = "1.2.0"
watchface-complications = "1.2.1"
health-services-client = "1.0.0"
guava = "31.1-android"
navigation-compose = "2.7.7"
lifecycle = "2.8.4"
datastore = "1.1.1"
firebase-bom = "33.1.2"
credentials = "1.5.0"
googleid = "1.1.1"
google-services = "4.4.2"
robolectric = "4.12.1"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
wear-compose-material = { module = "androidx.wear.compose:compose-material", version.ref = "wear-compose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wear-compose" }
wear-compose-navigation = { module = "androidx.wear.compose:compose-navigation", version.ref = "wear-compose" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
tiles = { module = "androidx.wear.tiles:tiles", version.ref = "tiles" }
tiles-material = { module = "androidx.wear.tiles:tiles-material", version.ref = "tiles" }
protolayout = { module = "androidx.wear.protolayout:protolayout", version.ref = "protolayout" }
watchface-complications-data-source-ktx = { module = "androidx.wear.watchface:watchface-complications-data-source-ktx", version.ref = "watchface-complications" }
health-services-client = { module = "androidx.health:health-services-client", version.ref = "health-services-client" }
# Pins the same guava version health-services-client already pulls in transitively at
# implementation (runtime-only) scope. Without this explicit compile-time dependency, Gradle's
# guava/listenablefuture capability resolution picks the empty "9999.0-empty-to-avoid-conflict-
# with-guava" listenablefuture artifact for the whole module (since a real guava IS present
# somewhere in the graph) but never actually puts real guava on the *compile* classpath (it's
# implementation-only in health-services-client's own POM) — breaking any existing
# com.google.common.util.concurrent.ListenableFuture usage (see GaugeTileService.kt) that
# previously resolved via the lightweight standalone `listenablefuture:1.0` artifact.
guava = { module = "com.google.guava:guava", version.ref = "guava" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
