# ===========================================================================
# 7b. Wear OS form-factor specifics  (Grow → Store presence → Store listings,
#     and Release → Setup → Advanced settings → Form factors)
#     Play asks these of Wear apps and of no one else.
# ===========================================================================
wear_os_listing:
  form_factor_opt_in:
    where: "Play Console → Grow → Store presence → Store listings (or Release → Setup → Advanced settings → Form factors) → add 'Wear OS'."
    value: "Wear OS is already the app's form factor — this record IS the standalone Wear listing."
    note: >
      If the console shows Wear OS as not yet added, add it. Adding a form
      factor is a listing action, not a release action, so it is in scope. Do
      NOT create or promote a release to satisfy a prompt about 'a Wear OS APK'.
  standalone_or_companion:
    question: "Is your Wear OS app standalone, or does it require a phone app?"
    value: "Standalone"
    why: >
      The manifest declares com.google.android.wearable.standalone = true, and
      the code backs that claim: the watch talks to the backend directly over
      its own HTTPS/WSS connection (OkHttp), never through the Wearable Data
      Layer, and there is no Data Layer dependency in the module at all. The
      core loop (arm, listen, feel a nudge) runs with no phone present and no
      account. Pairing to an account needs a phone or desktop BROWSER once, to
      type a 5-character code — not the MindShift phone app, and not a
      persistent connection.
    proof:
      - apps/watch/wearApp/src/main/AndroidManifest.xml:25-27   # standalone = true
      - apps/watch/wearApp/build.gradle.kts:122                  # OkHttp; no play-services-wearable
      - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/net/EpisodeWsClient.kt:80-87
      - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/ui/SignInScreen.kt:113-118  # "Enter <code> on your phone or gauge.app/pair"
    if_the_console_asks_for_the_companion_package:
      value: "com.sagearbor.mindshift.app"
      note: >
        Name it only if Play explicitly asks which phone app is related. Do NOT
        set a 'requires a phone app' flag — that would be false and would hide
        the listing from standalone-watch users.
  watch_face_declaration:
    value: "No — this is not a watch face."
    note: "The app ships a TILE and a COMPLICATION DATA SOURCE, which are not watch faces."
    proof: apps/watch/wearApp/src/main/AndroidManifest.xml:43-74
  wear_quality_review_notes:
    value: >
      Play reviews Wear apps against the Wear OS app quality checklist. Points
      that a reviewer will look for and that the code already satisfies —
      mention them in the App access instructions block if asked for more
      detail: the app is usable entirely by touch on a round screen (Wear
      Compose ScalingLazyColumn everywhere), it has no login wall on the core
      feature, its foreground service posts a persistent notification and stops
      on the user's off tap, and it requests RECORD_AUDIO and BODY_SENSORS at
      the point of use rather than at launch.
    proof:
      - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/ui/GlanceScreen.kt:390-400  # permission requested from the explicit arm tap
      - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/service/SentinelService.kt:67-77
  hardware_features:
    value: >
      The manifest declares <uses-feature android:name="android.hardware.type.watch"/>
      with no android:required attribute, which defaults to required=true —
      correct for a Wear-only app, and what makes Play offer the listing to
      watches only.
    proof: apps/watch/wearApp/src/main/AndroidManifest.xml:4
  data_layer:
    value: "Not used. There is no com.google.android.gms:play-services-wearable dependency and no WearableListenerService."
    proof: apps/watch/wearApp/build.gradle.kts:111-134

# ===========================================================================
# 8. Main store listing  (Grow → Store presence → Main store listing)
# ===========================================================================
store_listing:
  app_name:
    value: "MindShift: Wrist Coach"
    char_count: 22
    limit: 30
    why: >
      The listing currently reads just "MindShift", which is indistinguishable
      from the phone listing in search results and says nothing about what the
      watch does. This keeps the brand first and adds the one word that explains
      the form factor.
    if_the_owner_prefers_no_change: "Leave 'MindShift'. It is valid; it is just less useful."
    note: "The installed launcher label stays 'MindShift' — that is a string resource, not the store name."
    proof: apps/watch/wearApp/src/main/res/values/strings.xml:3
  short_description:
    value: "A buzz on your wrist when your voice starts to rise. No screen to read."
    char_count: 71
    limit: 80
    why: >
      Truthful to the code in every word: the output is a vibration
      (HapticDirector/PulseEngine), the trigger is the wearer's own loudness
      over their own baseline (SentinelDetector + ModeParams.triggerDbOverBaseline),
      and the product is explicitly designed to need no reading.
    replaces: "the existing 61-character short description"
    proof:
      - apps/watch/shared/src/commonMain/kotlin/app/gauge/shared/sentinel/ModePolicy.kt:34-38
      - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/haptics/HapticDirector.kt
  full_description:
    char_count: 3947
    limit: 4000
    replaces: "the existing 239-character full description"
    value: |
      MindShift on your wrist is a conversation coach that does not ask you to look
      at anything.

      You arm it before a conversation you know is going to be hard. It listens for
      your own voice getting louder than your own normal — not louder than some fixed
      number, louder than YOU usually are — and when it does, it taps you. One buzz
      for a first rung, a different pattern as it climbs. You feel it, you breathe,
      you drop back down. Nobody else in the room knows anything happened.

      The moment you most need that signal is the moment you are least able to look
      at a phone. A tap on the wrist lands in the one channel still free.

      HOW IT WORKS

      Tap the ring to arm. Three listening modes:

      • Standard — waits, then opens a session when you get about 6 dB over your own
        baseline. Keeps a rolling ten seconds so the moment that set it off is kept.
      • Battery saver — the same idea with a higher bar and a shorter buffer.
      • Session — for the conversation you already know is the hard one. Stays open
        from the moment you arm it.

      There is also Companion mode, for when you are already running a MindShift
      session on your phone. In Companion the watch never opens its microphone at all
      — the phone is listening, and the watch is purely the thing that buzzes.

      HEART RATE

      If you allow the body-sensor permission, the watch reads your heart rate while a
      session is running, and a jump well over your resting rate can raise a cue of
      its own. Deny it and everything else works the same — the app never guesses a
      number it does not have.

      ON THE WATCH ITSELF

      • A live meter — loudness, heart rate, movement or speaking rate, your pick —
        as a sparkline or a dial.
      • A tile and a complication, so you can see whether it is armed at a glance.
      • A settings screen that plays every haptic pattern on demand, so you learn the
        vocabulary before you need it.
      • "You & your person" — if you and a partner paired up in the MindShift app, a
        card showing how the two of you are doing this week. No transcripts.

      IT WORKS ON ITS OWN

      A standalone Wear OS app: no phone app required, no Bluetooth link to your
      phone — it reaches MindShift's servers by itself over Wi-Fi or LTE. Signing in
      is optional; you can arm it and feel nudges with no account at all. Sign in, by
      typing a five-character code into MindShift on any phone or browser, if you
      want your sessions saved, the couples card, or the two features below.

      SAVING AUDIO IS SOMETHING YOU TURN ON

      • "Save last 2 min" grabs the last two minutes of your own audio, after a
        confirmation tap, so you can go back to a moment that mattered.
      • "Journal" is an opt-in toggle that keeps a few minutes at a time while it is
        on. Raw journal uploads are deleted within 48 hours; after that only the
        stretches matching your own enrolled voice are kept.

      Both are off until you turn them on, and switching Journal off clears its consent.

      PRIVACY, PLAINLY

      The short version; the full version is at https://arborfam-hub.web.app/privacy.

      • While a session is running, your audio and your heart rate go to MindShift's
        servers. That is how the coaching is computed. In Companion mode no audio
        leaves the watch, because the microphone is never opened.
      • Your heart rate is used for your own cues and your own history. It is not sent
        to anyone else and not shown to anyone else.
      • Delete your whole account, and everything in it, yourself — in the MindShift
        app or at https://arborfam-hub.web.app/delete-account.
      • No ads. No advertising or analytics SDKs. Nothing sold to anyone, ever.

      WHAT IT IS NOT

      MindShift is a communication coach, not therapy, not counselling, and not a
      medical or mental-health device. The heart rate it reads is an input to a
      conversation cue, not a health measurement, and nothing here diagnoses or
      treats anything. If you or someone else is in crisis, contact a qualified
      professional or your local emergency services.

      Needs a Wear OS watch with a microphone. English only for now.
    truthfulness_audit:
      # Every factual claim above, and the file that backs it. Re-check this
      # list if the description is ever edited.
      - claim: "listens for your own voice over your own baseline"
        proof: apps/watch/shared/src/commonMain/kotlin/app/gauge/shared/sentinel/SentinelDetector.kt
      - claim: "Standard ~6 dB, 10 s buffer; Battery saver 10 dB, 5 s; Session continuous"
        proof: apps/watch/shared/src/commonMain/kotlin/app/gauge/shared/sentinel/ModePolicy.kt:34-38
      - claim: "Companion never opens the microphone"
        proof: apps/watch/shared/src/commonMain/kotlin/app/gauge/shared/sentinel/ModePolicy.kt:21-24,38
      - claim: "heart rate optional, never fabricated"
        proof: apps/watch/wearApp/src/main/kotlin/app/gauge/wear/sensors/HrSource.kt:36-38
      - claim: "meter: loudness / heart rate / movement / speaking rate"
        proof: apps/watch/shared/src/commonMain/kotlin/app/gauge/shared/signals/SignalKind.kt
      - claim: "sparkline or dial"
        proof: apps/watch/wearApp/src/main/kotlin/app/gauge/wear/prefs/GaugePrefs.kt:98-115
      - claim: "tile and complication"
        proof: apps/watch/wearApp/src/main/AndroidManifest.xml:43-74
      - claim: "settings plays every haptic pattern"
        proof: apps/watch/wearApp/src/main/kotlin/app/gauge/wear/ui/SettingsScreen.kt:71-143
      - claim: "couples card, no transcripts"
        proof: apps/watch/wearApp/src/main/kotlin/app/gauge/wear/net/WatchApiClient.kt:70-82
      - claim: "standalone, no Bluetooth/Data Layer"
        proof: apps/watch/wearApp/src/main/AndroidManifest.xml:25-27
      - claim: "sign-in optional, five-character code"
        proof: apps/watch/wearApp/src/main/kotlin/app/gauge/wear/ui/SignInScreen.kt:113-118
      - claim: "Save last 2 min needs a confirmation"
        proof: apps/watch/wearApp/src/main/kotlin/app/gauge/wear/ui/GlanceScreen.kt:227-266
      - claim: "Journal off by default; 48 h; self-voice filter; off clears consent"
        proof: apps/watch/wearApp/src/main/kotlin/app/gauge/wear/prefs/GaugePrefs.kt:126-154
      - claim: "48 h raw journal retention"
        proof: server/watch/journal.py:10-20,80
      - claim: "no ads or analytics SDKs"
        proof: apps/watch/wearApp/build.gradle.kts:111-134
    one_claim_deliberately_not_made: >
      The description does NOT say "your audio never leaves the watch" or
      anything like it, because that is false for every mic mode. It says the
      opposite, in the privacy section, in plain words. Do not soften that line.
  app_category:
    value: "Communication"
    alternative_if_rejected: "Lifestyle"
    do_not_use: ["Health & Fitness", "Medical"]
    why: "See data_safety._judgement_calls — those categories trigger the Health apps regime."
  tags:
