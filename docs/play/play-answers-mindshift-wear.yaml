_schema:
  what_this_is: >
    A complete, pre-decided answer pack for the Google Play Console "Set up your
    app" checklist for com.sagearbor.gauge.wear — the MindShift Wear OS watch
    app. There is no Play API for this checklist, so a browser agent (Claude in
    Chrome / Cowork) drives the forms. This file exists so that agent never has
    to guess, never has to stop and ask, and never invents an answer that
    contradicts what the code actually does.
  how_to_use: >
    Walk it top to bottom. Each section maps to one left-nav item in Play Console
    under "Policy → App content" or "Grow → Store presence → Main store listing".
    Every leaf value is the literal thing to type or the literal option to click.
    Where a field cannot be answered without the owner (credentials, uploads,
    a human judgement call), the value is the string OWNER_MUST_SUPPLY and the
    sibling `owner_action` says exactly what is needed. Never invent a value for
    an OWNER_MUST_SUPPLY field.
  key_conventions:
    - "`value:` is what to enter/select."
    - "`why:` is the justification — paste it into a Play appeal if one is ever needed."
    - "`proof:` is a file:line in this repo that makes the claim checkable."
    - "OWNER_MUST_SUPPLY means: stop, leave the field blank, report it, move on."
  relationship_to_the_phone_pack: >
    This is a SEPARATE Play app record from com.sagearbor.mindshift.app, so it
    needs its own App access, Ads, Content rating, Target audience and Data
    safety answers — Play does not inherit anything between two listings, even
    when one is the other's companion. Where the honest answer is identical, the
    wording here is deliberately the same as docs/play/play-answers-mindshift.yaml
    so the two declarations cannot drift. Where it DIFFERS, the difference is
    called out inline (`differs_from_phone_pack:`). The three real differences
    are: (1) the watch collects HEART RATE, which the phone does not; (2) the
    watch has no login screen of its own at all — it is paired to a phone
    account with a 6-character code shown on the watch, and it also runs
    unpaired under a shared legacy principal, whereas the phone always holds a
    real Firebase session (which, since 2026-09-20, may be an anonymous
    "Continue as guest" one); (3) the watch has no camera, no calls and no
    video. Since guest mode, BOTH packs answer App access "All functionality
    is available without special access" and neither needs a demo account.
  the_one_claim_this_pack_had_to_correct: >
    The brief this pack was written from assumed "audio does NOT leave the watch
    on the watch-alone lane". THE CODE SAYS OTHERWISE and this pack follows the
    code. In BATTERY_SAVER / STANDARD / SESSION mode the watch streams raw
    16 kHz PCM16 microphone audio to the MindShift server over a WebSocket
    (SentinelController.streamWindow -> EpisodeWsClient.sendPcmWindow), plus a
    5–10 s pre-trigger preamble, and the server retains up to 30 minutes of it
    inside the live-session document. COMPANION mode is the only mode that never
    opens the mic. See data_safety.data_types["Audio files → Voice or sound
    recordings"] and _provenance.watch_audio_leaves_the_device_on_every_mic_mode.
  verified_against_commit: d364c11  # ship/heat-judge-20260920 merged, 2026-09-20
  # ...plus the guest-mode change of the same day (app_access, account_creation_methods,
  # the Email-address data type, _provenance): docs/decisions/2026-09-20-guest-mode.md
  last_updated: 2026-09-20
  authored_by: Claude (agent), from a full read of apps/watch/ and server/watch/

app_identity:
  package_name: com.sagearbor.gauge.wear
  proof: apps/watch/wearApp/build.gradle.kts:22
  play_developer_account: "7699975610134980668 (Sage Arbor)"
  app_already_exists_in_console: true
  note: >
    The Play app record already exists as a standalone Wear OS listing. Its
    title is already "MindShift", a 61-character short description, a
    239-character full description and the app icon are already uploaded, and
    the contact details were set via the API. What is MISSING is: screenshots
    (none uploaded), and every "Set up your app" declaration below. This pack
    completes the declarations only — it does NOT ship a release.
  current_version: "0.5.0 (versionCode 16)"
  proof_version: apps/watch/wearApp/build.gradle.kts:25-26
  form_factor: "Wear OS (standalone)"
  proof_form_factor:
    - apps/watch/wearApp/src/main/AndroidManifest.xml:4      # <uses-feature android.hardware.type.watch>
    - apps/watch/wearApp/src/main/AndroidManifest.xml:25-27  # com.google.android.wearable.standalone = true
  installed_launcher_label: "MindShift"
  proof_label: apps/watch/wearApp/src/main/res/values/strings.xml:3
  min_sdk: 30
  target_sdk: 34
  proof_sdk: apps/watch/wearApp/build.gradle.kts:23-24
  backend_it_talks_to: "https://mindshift-api-664594784582.us-central1.run.app (the same Cloud Run service as the phone app)"
  proof_backend: apps/watch/wearApp/build.gradle.kts:28-32

# ===========================================================================
# 1. App access  (Policy → App content → App access)
# ===========================================================================
app_access:
  question: "Is all or some functionality of your app restricted?"
  value: "All functionality is available without special access"
  changed_2026_09_20_guest: >
    FLIPPED from "All or some functionality is restricted". Nothing about the
    WATCH changed — the three account-only features are still account-only.
    What changed is that getting an account stopped being a barrier: the
    phone app now has a one-tap "Continue as guest" (Firebase Anonymous
    Auth), and a guest account can pair a watch exactly like any other. So a
    reviewer can reach every watch feature with no credentials from anybody,
    which is what this Play question is actually asking. The reviewer
    instructions below were rewritten to use that path.
  why: >
    The watch's CORE loop — arm the sentinel, feel the haptic nudges — runs
    without any sign-in at all, because the episode WebSocket falls back to an
    unauthenticated `?account=default` URL when no device token is stored and
    the server accepts it (MINDSHIFT_ALLOW_LEGACY_ACCOUNT defaults to true in
    the production deploy). Three features DO need a paired account: "You &
    your person" (the couples standing card), "Save last 2 min" (retro capture
    upload) and "Journal — keep what I say" (automatic periodic capture
    upload); all three are hidden or refuse to act until
    `AccountPrefs.deviceToken` is non-null. Since 2026-09-20 that account
    costs nothing to obtain — install the phone app, tap "Continue as guest",
    and pair — so there is no credential a reviewer must be given and no part
    of the app they cannot reach. No demo account is required; leave the
    username/password fields blank.
  differs_from_phone_pack: >
    The WATCH works unpaired; the PHONE always requires a signed-in Firebase
    session. Since 2026-09-20 the phone's session can be an ANONYMOUS one
    ("Continue as guest"), so neither listing needs a demo account any more —
    but the two are still different models: the watch's unpaired mode is a
    shared legacy `?account=default` principal with no account behind it,
    while a phone guest is a real, isolated, deletable Firebase account.
  proof:
    - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/ui/GlanceScreen.kt:208-226  # couples + retro chips behind uiState.signedIn
    - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/ui/GlanceScreen.kt:305-316  # "Pair your watch first" for Journal
    - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/auth/AccountPrefs.kt:31     # isSignedIn == deviceToken != null
    - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/ui/SignInScreen.kt:129      # unpaired account id is the literal "default"
    - server/watch/auth.py:149-153                                                   # allow_legacy + ?account= -> a legacy Principal
    - server/watch/config.py:16-19                                                   # MINDSHIFT_ALLOW_LEGACY_ACCOUNT defaults true
    - scripts/deploy_cloudrun.sh:130-131                                             # ...and the deploy leaves it true
  instructions_block:
    name: "Wear OS app — no account needed"
    # Play shows this text verbatim to the reviewer. Keep it short and literal.
    # A Wear reviewer usually has a Wear OS emulator, not a physical watch.
    # The pairing wording below is taken from the real screens:
    # apps/mobile/src/screens/WatchSetupScreen.tsx (6-character code, "Pair")
    # and apps/watch/.../ui/SignInScreen.kt (the watch shows the code).
    value: |
      No account is needed. MindShift for Wear OS is a standalone watch app.
      It does NOT need the phone app installed to run, and it does NOT use the
      Wearable Data Layer.

      TO TEST THE CORE FEATURE WITHOUT ANY ACCOUNT (takes 2 minutes):
        1. Open MindShift on the watch. Allow the microphone permission when
           asked. (Allow body sensors too if you want the heart-rate meter;
           it is optional and the app works without it.)
        2. Tap the ring in the middle of the screen to arm it. The screen
           shows "On" and a persistent notification appears.
        3. Speak, then raise your voice noticeably above your normal level for
           about 5 seconds. The watch vibrates with a coaching nudge. That is
           the whole product.
        4. Tap the ring again to turn it off.

      TO TEST THE ACCOUNT-ONLY FEATURES (couples standing card, "Save last
      2 min", "Journal") — still no credentials needed:
        1. Install the MindShift PHONE app (com.sagearbor.mindshift.app) on
           any Android phone, or open https://arborfam-hub.web.app in a
           browser — it is the same app.
        2. On its first screen, scroll to the bottom and tap "Continue as
           guest". You are now signed in to a throwaway anonymous account.
        3. Tap the round profile button in the top-right corner, then
           "Settings", then "Set up your watch".
        4. On the WATCH, scroll down and tap "Sign in". The watch displays a
           6-character code.
        5. Back in the phone app, under "Pair your watch", type that code into
           the CODE box and tap "Pair". It pairs as soon as all 6 characters
           are in; you will see "Watch paired ✓".
        6. The watch screen advances by itself within about 10 seconds. The
           "You & your person" and "Save last 2 min" chips now appear.

      There is no chat, no calling and no camera in the watch app.
    username: ""
    password: ""
  owner_action: >
    Nothing to supply — leave the username/password fields blank, and do NOT
    enter a real account. (This used to reuse the phone pack's throwaway demo
    account; the phone's guest mode, added 2026-09-20, removed the need for
    either listing.) One standing precondition, shared with the phone pack:
    Firebase Console → arborfam-hub → Authentication → Sign-in method →
    Anonymous must stay ENABLED, or the phone's guest button fails and these
    instructions stop working.
  any_other_instructions: "No"
  agent_note: >
    Pick "All functionality is available without special access". If Play
    still asks for an access-instructions block anyway, paste the
    instructions_block text above and leave the credential fields empty.

# ===========================================================================
# 2. Ads  (Policy → App content → Ads)
# ===========================================================================
ads:
  question: "Does your app contain ads?"
  value: "No, my app does not contain ads"
  why: >
    There is no advertising, attribution or analytics SDK of any kind. The
    wearApp module's COMPLETE dependency list is: the shared Kotlin module,
    Compose BOM, wear-compose material/foundation/navigation, activity-compose,
    ui-tooling(-preview), OkHttp, wear tiles + tiles-material, protolayout,
    watchface-complications-data-source-ktx, kotlinx-coroutines-core,
    kotlinx-serialization-json, androidx health-services-client, and Guava. No
    AdMob, no Play Services Ads, no Firebase, no Crashlytics, no Sentry, no
    Segment/Amplitude/Mixpanel/AppsFlyer/Adjust/Branch. The manifest does not
    request com.google.android.gms.permission.AD_ID and no advertising
    identifier is read anywhere in the module.
  proof:
    - apps/watch/wearApp/build.gradle.kts:111-134   # the complete dependency list
    - apps/watch/shared/build.gradle.kts            # the shared module's deps — kotlinx only
    - apps/watch/wearApp/src/main/AndroidManifest.xml:6-16  # permissions; no AD_ID
  note_for_the_agent: >
    Play will separately ask whether the app has ads in the Data safety
    "Advertising or marketing" purpose. Answer no there too — nothing is
    collected for advertising.

# ===========================================================================
# 3. Content rating  (Policy → App content → Content ratings → IARC questionnaire)
# ===========================================================================
content_rating:
  email_address: sagearbor@gmail.com
  category:
    value: "Utility, Productivity, Communication, or Other"
    why: >
      Same product, same category as the phone listing: this is a
      communication-coaching tool. It is not a game, not social networking (no
      feed, no profiles, no discovery, no stranger-to-stranger contact), not
      dating, not entertainment, not news/reference, and deliberately not a
      health or medical app even though it reads heart rate — the heart rate is
      an input to a conversation cue, never a health assessment.
    if_that_exact_label_is_absent: >
      IARC wording drifts. Pick the option whose text contains "Utility",
      "Productivity" or "Communication". Do NOT pick "Social Networking", do
      NOT pick "Games", and do NOT pick "Health" or "Medical" if those appear.
    proof:
      - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/ui/GlanceScreen.kt:281-303  # the whole feature surface is one screen of chips
      - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/haptics/HapticDirector.kt   # the output is vibration, not content

  violence:
    answer_to_every_question_in_this_section: "No"
    questions:
      - question: "Does the app contain violence (realistic, cartoon, fantasy) or references to violence?"
        value: "No"
      - question: "Does the app contain graphic depictions of blood, gore, or mutilation?"
        value: "No"
      - question: "Does the app depict or reference torture, killing, or harm to identifiable human beings?"
        value: "No"
      - question: "Does the app glamorize or trivialize the use of weapons?"
        value: "No"
    why: >
      The watch app ships NO authored content at all beyond its own UI strings
      and a fixed vocabulary of haptic patterns. There is no text feed, no
      images, no audio playback, no video. The entire output surface is
      vibration plus a handful of short status words on a 1.2" screen.
    proof:
      - apps/watch/shared/src/commonMain/kotlin/app/gauge/shared/NudgeVocabulary.kt  # the complete authored vocabulary
      - apps/watch/wearApp/src/main/res/values/strings.xml                           # the complete string resource file

  sexuality:
    answer_to_every_question_in_this_section: "No"
    questions:
      - question: "Does the app contain nudity, partial nudity, or sexually suggestive content?"
        value: "No"
      - question: "Does the app contain references to or depictions of sexual acts?"
        value: "No"
      - question: "Does the app provide access to sexual or erotic material?"
        value: "No"

  language:
    answer_to_every_question_in_this_section: "No"
    questions:
      - question: "Does the app contain profanity, crude humour, or vulgar language?"
        value: "No"
    why: >
      Nothing the app authors contains profanity, and unlike the phone the watch
      never renders a transcript — it has no text of the user's conversation on
      screen at any point. Do NOT answer "Yes" here; that question is about
      content the developer ships.

  controlled_substance:
    answer_to_every_question_in_this_section: "No"
    questions:
      - question: "Does the app contain references to, or depictions of, alcohol, tobacco, or drugs?"
        value: "No"

  gambling_and_contests:
    answer_to_every_question_in_this_section: "No"
    questions:
      - question: "Does the app contain gambling, simulated gambling, or contests?"
        value: "No"
      - question: "Does the app allow real-money gambling or wagering?"
        value: "No"

  miscellaneous:
    - question: >
        Does the app natively allow users to interact or exchange content with
        other users (chat, voice/video communication, sharing images, audio or
        video)?
      value: "Yes"
      why: >
        One real, narrow user-to-user surface: the "You & your person" standing
        card. A wearer who has joined a pair group sees the OTHER member's
        display name and that member's period standing relative to their own
        ("<Partner> is slightly ahead this period"), and the other member sees
        theirs. That is content about one user shown to another, so the honest
        answer is Yes. Note what is NOT here: no chat, no calls, no camera, no
        message composition, no sharing action of any kind initiated from the
        watch. The watch is read-only against the groups API — the client can
        only GET /me/standing, GET /groups and GET /groups/{id}/standing.
        Separately, the audio the watch uploads becomes a session under the
        wearer's MindShift account, which the wearer can later share with a
        therapist — but that share is performed in the phone/web app, not here.
      proof:
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/control/CouplesStanding.kt:48,61-62  # partner display name + relative standing
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/net/WatchApiClient.kt:70-82          # the complete groups surface: three GETs
        - server/watch/routers/groups.py:20-27                                                   # mutual-visibility consent on the group doc
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/net/WatchApiClient.kt:83-114          # the only writes are captures + claim-legacy
      if_the_form_only_offers_a_single_yes_no: >
        Answer Yes, then answer the follow-ups honestly: moderation = none
        (there is no public surface to moderate), user reporting = not
        applicable (no strangers), location sharing = No.
    - question: >
        Do those interactions happen with users the person does not know / can
        strangers contact each other?
      value: "No"
      why: >
        There is no discovery, no directory, no public profile and no matching.
        A pair group is created and joined in the phone/web app with an 8-
        character invite code handed over out of band, capped at 2 members, and
        mutual visibility is an explicit consent record on the group document.
        The watch cannot create, invite to, or join a group at all.
      proof:
        - server/watch/routers/groups.py:20-27,44-45   # invite code, mutual_visibility consent, PAIR_MAX_MEMBERS
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/net/WatchApiClient.kt:70-82  # read-only from the watch
    - question: "Does the app share the user's current physical location with other users?"
      value: "No"
      why: >
        No location permission is declared and no location API is used anywhere
        in the module. The manifest's complete permission list is RECORD_AUDIO,
        BODY_SENSORS, POST_NOTIFICATIONS, FOREGROUND_SERVICE,
        FOREGROUND_SERVICE_MICROPHONE, WAKE_LOCK, VIBRATE, INTERNET.
      proof: apps/watch/wearApp/src/main/AndroidManifest.xml:6-16
    - question: "Does the app allow users to purchase digital goods?"
      value: "No"
      why: "There is no billing library and no IAP code path in the module."
      proof: apps/watch/wearApp/build.gradle.kts:111-134
    - question: "Does the app contain any content or links that take the user to a website outside the app?"
      value: "No"
      why: >
        The sign-in screen PRINTS a URL as text ("Enter <code> on your phone or
        gauge.app/pair") for the wearer to type on another device. Nothing in
        the watch app opens a browser — there is no Intent.ACTION_VIEW, no
        CustomTabs, no WebView anywhere in the module.
      proof:
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/ui/SignInScreen.kt:113-118  # the URL is display text only
      agent_note: >
        If the form's wording is "does the app display any links", answer No —
        an un-tappable string is not a link. If it asks "can the user reach
        arbitrary web content", the answer is also No (no browser, no WebView).
    - question: "Does the app collect or share the user's personal information?"
      value: "Yes"
      why: "See the data_safety section below — microphone audio, heart rate, account and device ids."
    - question: "Is the app a 'news' app?"
      value: "No"
    - question: "Does the app enable digital purchases of real-world goods or services?"
      value: "No"
    - question: "Is the app designed for or targeted at children?"
      value: "No"
      why: "See target_audience below — 18+ only."

  expected_result:
    value: "Expected: IARC 'Everyone' / PEGI 3 / ESRB Everyone, with a 'Users Interact' interactive element."
    note: >
      The "Users Interact" descriptor is EXPECTED and correct — it comes from
      the couples standing answer above, and it matches the phone listing's
      rating. Do not go back and change answers to make it disappear.

  agent_stop_rule:
    value: "STOP at the review/summary screen. Do NOT press Submit."
    why: >
      A submitted rating is what unlocks a release, and this pack is explicitly
      not authorised to publish anything. Fill every answer, screenshot the
      summary, and hand it to the owner to press Submit.

# ===========================================================================
# 4. Target audience and content  (Policy → App content → Target audience)
# ===========================================================================
target_audience:
  age_groups_selected:
    value: ["18 and over"]
    why: >
      Mirrors the phone listing exactly, and for the same reasons plus one more.
      The app records real conversations from a wrist-worn microphone, reads the
      wearer's heart rate, and is positioned for couples and couples therapy. It
      is intended for adults. Selecting only 18+ keeps the app out of the
      Families policy programme and out of Teacher Approved review — which is
      correct, because nothing here is designed for or appealing to minors, and
      a body-sensor + always-listening wearable aimed at children would attract
      exactly the scrutiny it deserves.
    proof:
      - PRD.md:26-33   # target users: therapists, therapy patients, couples
      - apps/watch/wearApp/src/main/AndroidManifest.xml:6-7   # RECORD_AUDIO + BODY_SENSORS
  do_not_select: ["Ages 5 and under", "Ages 6-8", "Ages 9-12", "Ages 13-15", "Ages 16-17"]
  store_presence_appeals_to_children:
    question: "Could your store listing unintentionally appeal to children?"
    value: "No"
    why: >
      The icon is the same muted adult mark as the phone listing and the
      screenshots are a watch face showing a meter and a status word. No cartoon
      characters, no bright primary-colour play imagery, no child actors, no
      toys or games.
  ads_shown_to_children:
    value: "Not applicable — the app has no ads."
  designed_for_families:
    value: "No"
    note: "Wear OS apps are ineligible for the Families programme in any case."
  known_child_users:
    question: "Do you have any known users under the target age?"
    value: "No"
  google_play_families_policy:
    value: "Not opted in."
  news_app:
    value: "No"
  covid_19_contact_tracing_or_status:
    value: "No"
  data_safety_child_note: >
    Because 18+ is the only selected age group, Play will not ask for a Families
    Ads SDK declaration or a Teacher Approved submission. If the console still
    shows those, the age selection did not save — re-check it.

# ===========================================================================
# 5. Data safety  (Policy → App content → Data safety)
# ===========================================================================
data_safety:
  _reading_note: >
    Play's "Shared" has a narrow definition that EXCLUDES transfers to a service
    provider processing on your behalf, and transfers triggered by a specific
    user-initiated action. Under a strict reading, the server-side transcription
    and analysis providers (processors) and the couples standing (user-initiated)
    would both be "not shared". This pack deliberately declares them as SHARED
    anyway, exactly as the phone pack does. Over-declaring is never an
    enforcement risk; under-declaring is exactly how apps get flagged, and the
    privacy policy at https://arborfam-hub.web.app/privacy names the processors
    by company. Keep the two consistent — if you ever change one, change the
    other.
  _watch_specific_reading_note: >
    The watch app is a thin client for the SAME backend and the SAME account as
    the phone app. Everything the watch uploads lands under the wearer's
    MindShift account and is then handled by the server exactly as phone-sourced
    data is — same buckets, same Firestore project, same processors, same
    deletion path. So this matrix is the phone's matrix minus the types the
    watch cannot produce (no camera, no calls, no typed text) plus the two it
    alone produces: HEART RATE, and a per-install DEVICE ID.

  overview:
    does_your_app_collect_or_share_any_of_the_required_user_data_types:
      value: "Yes"
    account_creation_methods:
      changed_2026_09_20_guest: "New key. Guest mode added the fourth method."
      value:
        - "Email and password"
        - "Google (federated sign-in)"
        - "Apple (federated sign-in) — placeholder in the UI, disabled, not yet live"
        - "Other: anonymous guest accounts created in-app"
      differs_from_phone_pack: >
        The list is the same because the ACCOUNT is the same — the watch app
        creates no account of its own and has no sign-up screen. Every method
        above happens in the phone/web app; the watch only redeems a
        6-character pairing code against an account that already exists. A
        watch running UNPAIRED has no account at all (it uses the shared
        legacy "default" principal), which is why the pack declares unpaired
        sessions as not reachable by deletion — see `not_reachable_by_deletion`.
      why: >
        Play's account-deletion questionnaire asks how a user gets an account,
        because that decides who must be offered the in-app delete. Since
        2026-09-20 there is a FOURTH way: tapping "Continue as guest" in the
        phone/web app silently creates a Firebase Anonymous Auth user. The
        user types nothing, but a real account with a uid exists, watch data
        pairs to it and is stored under it, and it gets exactly the same
        self-serve deletion as any other account (DELETE /me is uid-scoped and
        never reads the sign-in provider). A guest account can pair a watch,
        which is the whole reason this listing's App access no longer needs a
        demo account.
      proof:
        - apps/mobile/src/screens/LoginScreen.tsx       # Continue as guest, alongside email/Google/Apple
        - apps/mobile/src/store/authStore.ts            # signInAnonymously; linkGuestToEmailPassword keeps the uid
        - apps/mobile/src/screens/WatchSetupScreen.tsx  # a guest pairs a watch through the same screen
        - server/watch/routers/pairing.py               # POST /me/pair/claim — any authenticated account
        - server/watch/auth.py                          # the anonymous account row: provider="anonymous", is_guest=True
        - server/routers/account.py                     # DELETE /me — uid only, no provider check
        - server/tests/test_guest_mode.py               # incl. a device token never un-guesting an account
    is_all_of_the_user_data_collected_by_your_app_encrypted_in_transit:
      value: "Yes"
      why: >
        Every network hop from the watch is TLS. The compiled-in API base is an
        https:// Cloud Run URL and the WebSocket base is derived from it by
        replacing https:// with wss:// (and http:// with ws://, a branch that is
        dead in the shipped build because the compiled base is https). The
        pairing client, the captures/journal uploads and the telemetry POSTs all
        use that same https base via OkHttp, which verifies certificates by
        default and is not reconfigured anywhere in the module.
      proof:
        - apps/watch/wearApp/build.gradle.kts:28-32                                    # GAUGE_API_BASE is https://
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/service/SentinelService.kt:1098-1099  # wsBaseUrlFromApiBase: https -> wss
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/net/WatchApiClient.kt:116   # every REST call on the same base
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/telemetry/TelemetryClient.kt:44-47  # POST $baseUrl/telemetry
        - scripts/deploy_cloudrun.sh:210-228                                            # Cloud Run managed HTTPS
    do_you_provide_a_way_for_users_to_request_that_their_data_is_deleted:
      value: "Yes"
      deletion_url: "https://arborfam-hub.web.app/delete-account"
      account_deletion_is_self_serve: true
      why: >
        The watch's data lives under the wearer's MindShift account, and full
        account deletion is self-serve and immediate from the phone or web app
        (Settings → Account → "Delete my account" → type DELETE → DELETE /me).
        That endpoint's watch tier erases, for the caller's uid: every watch
        live session (which is where the uploaded PCM and the heart-rate series
        live), every capture (the audio BLOB first, then the metadata document
        — so no orphaned audio), the enrollment baseline, vector subscriptions,
        the speaker profile, the watch account document, and every watch pairing
        (device tokens, claimed pairing records, the failed-claim record).
      how_the_user_reaches_it_from_a_watch: >
        Not from the watch. The watch app has no delete control and no account
        screen beyond pairing. The deletion path is the phone or web app, or the
        /delete-account page — which is what the Play deletion URL points at,
        so the requirement is satisfied. SAY THIS PLAINLY in the listing rather
        than implying a wrist-side delete exists.
      proof:
        - server/account_deletion.py:278-333    # the watch tier: live sessions, captures (blob then doc), baseline, profile, pairings
        - server/account_deletion.py:117-119    # the live_sessions / watch_captures / watch_pairings counters
        - server/routers/account.py             # DELETE /me — fresh-token guard, {"confirm":"DELETE"}, 3/min per IP
        - apps/mobile/src/screens/AdvancedScreen.tsx   # Settings → Account → Delete my account
        - apps/mobile/public/delete-account/index.html # the page the URL above serves
    not_reachable_by_deletion:
      value: >
        Two leftovers, both already disclosed on the /delete-account page and in
        the privacy policy, and both true of the watch specifically:
        (1) WATCH TELEMETRY. The crash/diagnostic events the watch posts to
        POST /telemetry are keyed to a per-install device UUID and carry no
        account id at all, so DELETE /me cannot find them (the phone's
        diagnostics tier deletes by data.uid, which watch telemetry never sets).
        (2) UNPAIRED-WATCH SESSIONS. See _open_risks below — audio streamed
        before the watch is paired is stored under the shared legacy account id
        "default", which belongs to no uid and which DELETE /me therefore never
        touches.
      proof:
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/telemetry/Telemetry.kt:64-68  # TelemetryClient(device = GaugePrefs.deviceId(...))
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/prefs/GaugePrefs.kt:36-43     # a random per-install UUID
        - server/account_deletion.py:336-352                                              # diagnostics tier deletes by account
        - server/watch/routers/rest.py:376-378                                            # LEGACY_ACCOUNT_ID sessions

    data_types_not_collected_at_all:
      - "Location (approximate and precise)"   # no location permission, no location API in the module
      - "Financial info (all)"                 # no billing, no payments
      - "Fitness info"                         # NOTE: "Health info" IS collected — see the matrix. No steps/workouts/calories.
      - "Emails / SMS or MMS"                  # never read
      - "Photos and videos"                    # the watch has no camera and no media access
      - "Contacts / Calendar"                  # no library, no permission
      - "Web browsing history"                 # no browser, no WebView
      - "Installed apps"                       # never queried
      - "In-app search history"                # there is no search
      - "Messages → Other in-app messages"     # the watch never sends or renders any conversation text

  # -------- the matrix. One block per Play data type that IS declared. -------
  data_types:

    - play_path: "Audio files → Voice or sound recordings"
      collected: true
      shared: true
      processed_ephemerally: false
      required_or_optional: "Required"
      purposes: ["App functionality"]
      what_it_actually_is: >
        MICROPHONE AUDIO FROM THE WATCH, AND IT LEAVES THE DEVICE. This is the
        single most important line in this pack and the one the earlier
        assumption got backwards. In BATTERY_SAVER, STANDARD and SESSION mode
        the watch opens the mic and reads 1-second windows of 16 kHz mono PCM16.
        When the sentinel reaches STREAMING it opens a WebSocket to the
        MindShift backend and sends every window as a binary frame
        (SentinelController.streamWindow -> EpisodeWsClient.sendPcmWindow),
        preceded by the pre-trigger ring buffer (5 s in BATTERY_SAVER, 10 s in
        STANDARD) so the moment that triggered the episode is included.
        SESSION mode streams continuously with no trigger at all. COMPANION
        mode is the ONLY mode that never touches the mic — there the phone
        listens and the watch socket carries heartbeats and heart rate only.
        On top of the live stream there are two separate upload paths, both
        behind an explicit on-screen confirmation:
          * "Save last 2 min" — the wearer taps a chip, confirms a dialog, and
            the last 120 s of the rolling retro buffer is gzipped and POSTed to
            the captures API.
          * "Journal — keep what I say" — an opt-in toggle (OFF by default)
            that, once confirmed, uploads a snapshot of up to 300 s of the
            wearer's own audio every 5 minutes for as long as it stays on.
      what_is_actually_kept: >
        Live-stream audio: the server accumulates the episode's PCM and writes
        it into the live-session Firestore document as base64
        (LiveSession.pcm_b64), capped at MAX_LIVE_SESSION_PCM_BYTES (30 minutes
        at 32 KB/s); past the cap the audio stops being retained while nudging
        continues. If the base64 would exceed the Firestore document limit the
        store writes an empty string rather than a truncated one. Retro captures
        and journal captures: the raw PCM is written to the captures GCS bucket
        under captures/{account}/{id}.pcm. Journal captures additionally carry a
        48-hour hard retention — every journal capture is stamped
        journal_expires_at and each new one triggers a cleanup pass that deletes
        expired journal captures blob-first. A manual "Save last 2 min" capture
        has NO expiry; it lives until the user deletes it or deletes the account.
      why_shared: >
        Same processors as the phone: the server transcribes and analyses the
        stored audio through the configured speech-to-text provider and sends
        the resulting transcript text to Anthropic for the analysis pass. The
        tone/heat models that score the audio run locally on our own Cloud Run
        instance (server/tone_id.py loads pinned Hugging Face checkpoints at
        startup and runs them on CPU) — no audio goes to a model vendor's API.
      proof:
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/control/SentinelController.kt:830-852   # streamWindow -> client.sendPcmWindow
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/control/SentinelController.kt:683-686   # the pre-trigger preamble is sent too
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/net/EpisodeWsClient.kt:155-158          # sendPcmWindow — a binary WS frame
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/service/MicReader.kt:11-13,38-53        # 16 kHz mono PCM16 off the device mic
        - apps/watch/shared/src/commonMain/kotlin/app/gauge/shared/sentinel/ModePolicy.kt:21-24,34-38  # usesMic per mode; COMPANION is the only false
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/control/SentinelController.kt:327-332   # COMPANION returns before any mic read
        - server/watch/routers/ws.py:345-368                                                        # server appends inbound bytes to pcm_buffer
        - server/watch/routers/ws.py:300-317                                                        # ...and persists it as pcm_b64 on the live session
        - server/watch/store.py:54-83                                                               # the Firestore doc-size guard on pcm_b64
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/capture/RetroCaptureUploader.kt:38-62   # POST /captures + PUT /captures/{id}/audio, gzip
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/journal/JournalUploader.kt:32-62        # the journal three-call upload
        - server/watch/routers/captures.py:174-199                                                 # captures/{account}/{id}.pcm in GCS
        - server/watch/journal.py:10-20,80                                                          # 48 h journal retention, self-voice filter
      user_controls:
        - "Mode → Companion: the mic is never opened at all; only heart rate and nudges use the socket."
        - "The ring on the main screen is a hard on/off for the whole sentinel, mic included."
        - "'Save last 2 min' requires a tap plus a confirm dialog every single time; Cancel sends nothing."
        - "'Journal' is OFF by default, requires an explicit confirm, and turning it off clears the stored consent so the next ON needs a fresh confirmation."
      proof_user_controls:
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/ui/GlanceScreen.kt:227-266   # the retro-capture confirm dialog + Cancel path
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/ui/GlanceScreen.kt:317-356   # the journal consent dialog + Cancel path
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/prefs/GaugePrefs.kt:117-154  # journalMode defaults false; consent minted/cleared atomically
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/capture/RetroCaptureUploader.kt:43-44  # no consent artifact -> no network call at all
      required_because: >
        Declared Required, not Optional, because the live PCM stream is not
        something the wearer opts into per session: arming the sentinel in any
        mic mode streams audio whenever an episode triggers. The two capture
        paths ARE optional, but Play asks one question per data TYPE, and when
        one path for a type is unavoidable the honest answer for the type is
        Required.

    - play_path: "Health and fitness → Health info"
      collected: true
      shared: false
      processed_ephemerally: false
      required_or_optional: "Optional — users can choose whether it's collected"
      purposes: ["App functionality", "Personalization", "Analytics"]
      what_it_actually_is: >
        HEART RATE IN BEATS PER MINUTE, read live from the watch's optical
        sensor through Wear Health Services (androidx.health.services.client,
        DataType heart rate, BODY_SENSORS permission) and TRANSMITTED TO THE
        MINDSHIFT SERVER. Two paths, both on the episode WebSocket as
        {"type":"hr","bpm":...,"t":...} text frames:
          * Mic modes: one sample per 1-second window for as long as an episode
            is STREAMING and the socket is up.
          * COMPANION mode: one sample at most every COMPANION_HR_INTERVAL_MS
            = 5000 ms, for as long as the companion socket is open — which can
            be all day.
        Server-side the handler appends EVERY sample to hr_bpm_series with a
        parallel hr_t_series on the session clock (not just the ones that
        crossed a threshold), and persists both inside the live-session document
        under the wearer's account. A companion socket that carried no audio but
        did carry heart rate is saved under a derived id with status
        "companion_hr" — one document per connection.
      why_it_is_used: >
        A heart-rate jump of +15 / +25 / +35 bpm over the wearer's resting rate
        raises a channel-B vector, which can contribute to the nudge the wrist
        plays. The full series is also kept so the product can answer whether
        heart rate adds anything over loudness at all — the negatives matter as
        much as the positives, which is exactly why every sample is stored and
        not only the spikes.
      why_not_shared: >
        The bpm values and the stored series never leave MindShift's own Google
        Cloud project. Nothing puts them in a payload to Deepgram, Anthropic, or
        any other third party: the transcription provider receives audio, the
        LLM receives transcript text, and neither call site carries the HR
        series. They are not shown to another user either — the couples standing
        card exposes only session counts and a calm score, never bpm.
      optional_because: >
        Heart rate is collected only if the wearer grants BODY_SENSORS. The app
        never requests that permission implicitly, the sentinel arms and nudges
        without it, and every code path degrades honestly to "no reading" rather
        than a fabricated value. Denying the permission costs the meter and the
        hr_spike channel and nothing else.
      play_category_judgement: >
        Play's Data safety taxonomy has "Health and fitness → Health info"
        ("information about a user's health, such as ... symptoms, physical or
        mental health") and "Fitness info" (exercise, activity). A continuously
        sampled heart rate is health info, not fitness info — there is no
        workout, no step count, no calorie estimate anywhere in the module. Tick
        Health info; leave Fitness info unticked.
      differs_from_phone_pack: >
        THIS IS THE BIG ONE. The phone pack declares "Health and fitness (all)"
        as NOT collected, and that stays true of the phone binary — the phone has
        no body sensor and never reads one. The watch does. Do not copy the
        phone's answer here.
      user_can_delete: >
        Yes — the series lives inside the live-session documents that DELETE /me
        erases, and an individual watch live session can be deleted on its own
        via DELETE /live-sessions/{id}.
      proof:
        - apps/watch/wearApp/src/main/AndroidManifest.xml:7                                          # BODY_SENSORS
        - apps/watch/wearApp/build.gradle.kts:129                                                    # androidx health-services-client
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/sensors/HrSource.kt:1-20                 # Health Services live HR measure stream
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/control/SentinelController.kt:444-451    # a sample per window while STREAMING
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/control/SentinelController.kt:555-568    # trySendHr -> client.sendHr
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/control/SentinelController.kt:606-619    # maybeSendCompanionHr, rate-limited
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/control/SentinelController.kt:1168       # COMPANION_HR_INTERVAL_MS = 5_000L
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/net/EpisodeWsClient.kt:160-168           # the {"type":"hr"} frame
        - server/watch/routers/ws.py:236-244                                                         # hr_bpm_series / hr_t_series: EVERY sample
        - server/watch/routers/ws.py:300-317                                                         # persisted in LiveSession.series
        - server/watch/routers/ws.py:319-337                                                         # save_companion_hr -> status "companion_hr"
        - server/watch/models.py:83-95                                                               # the "companion_hr" status and series field
        - server/watch/routers/rest.py:513-526                                                       # DELETE /live-sessions/{id}
        - server/account_deletion.py:290-297                                                         # ...and the account-wide erase

