graphics_checklist:
  app_icon:
    required: "512 × 512 PNG (32-bit, with alpha), ≤ 1 MB"
    status: "ALREADY UPLOADED to this listing. Do not re-upload and do not regenerate."
    in_app_source: apps/watch/wearApp/src/main/res/drawable-nodpi/ic_launcher_fg.png
    note: "The in-app launcher foreground lives at the path above; the store icon is the same mark as the phone listing's."
  feature_graphic:
    required: "1024 × 500 PNG or JPEG, no alpha, ≤ 15 MB"
    value: "Reuse the phone listing's: apps/mobile/assets/play/feature-graphic.png (verified 1024×500)."
    note: "Play requires a feature graphic on every listing. Nothing in it is phone-specific."
  wear_os_screenshots:
    required: >
      THE BLOCKER FOR THIS LISTING. Play requires Wear OS screenshots for a Wear
      form-factor listing and this record has NONE. Minimum 2 (upload 4).
      Each must be SQUARE (1:1), each side between 384 and 3840 px, PNG or
      JPEG (24-bit, no alpha), ≤ 8 MB each.
    recommended_size: "454 × 454 px — the native resolution of the Pixel Watch the owner tests on, comfortably inside the 384–3840 range."
    how_to_take_one: >
      On a Pixel Watch with the build installed and the watch connected to the
      Mac: `adb -s <watch serial> exec-out screencap -p > shot.png`. The result
      is already square on a round watch; do NOT crop it to a circle and do NOT
      paste it into a watch-shaped marketing frame — Play wants the actual
      screen. If a physical watch is not available, a Wear OS emulator
      screenshot of the real build is acceptable and is what most Wear listings
      use.
    capture_exactly_these_four:
      - order: 1
        screen: "Live gauge, mid-episode"
        how: >
          Arm the sentinel (tap the centre ring, allow the microphone), then
          talk loudly enough to open an episode. Capture while the centre shows
          the live meter with the sparkline moving and the status reading On.
        why: "This is the product. It must be screenshot #1 — it is the only one that shows what the app does while it is working."
        file: apps/watch/wearApp/src/main/kotlin/app/gauge/wear/ui/GlanceScreen.kt
      - order: 2
        screen: "A nudge landing"
        how: >
          Same armed state, but capture at the instant a nudge fires — the
          channel level is published to the UI and the complication at the same
          moment the haptic plays, so the screen shows the raised level. Easiest
          repeatable way: Settings → "Feel the buzzes" → Nudge · level 3, which
          plays the real pattern through the real vibrator, then capture the
          main screen straight after a real trigger.
        why: "A haptic cannot be screenshotted, so this is the only way to show the one thing the wearer actually experiences."
        file: apps/watch/wearApp/src/main/kotlin/app/gauge/wear/haptics/HapticDirector.kt
      - order: 3
        screen: "Enrolment / baseline — the sign-in code screen"
        how: >
          Scroll to "Sign in" and capture the screen showing "Enter XXXXX on
          your phone or gauge.app/pair". This is the watch's entire onboarding.
        why: >
          It is the honest picture of how a watch gets attached to an account,
          and it is the screen the Play reviewer will be following the App
          access instructions through. NOTE: there is no separate enrolment or
          baseline-capture screen on the watch — the loudness baseline is
          learned silently by SentinelDetector from the first windows of each
          armed stretch, so do not go looking for a wizard that does not exist.
        file: apps/watch/wearApp/src/main/kotlin/app/gauge/wear/ui/SignInScreen.kt
      - order: 4
        screen: "Settings — the haptic vocabulary"
        how: >
          Settings → scroll to "Feel the patterns" and capture the list of named
          patterns with their icons.
        why: "Shows the depth of the product in one image and makes the 'learn the vocabulary before you need it' claim in the description checkable."
        file: apps/watch/wearApp/src/main/kotlin/app/gauge/wear/ui/SettingsScreen.kt
    optional_fifth:
      screen: "You & your person"
      how: "Pair the watch to an account that is in a pair group, open the couples chip, capture the standing card."
      why: "Backs the couples claim in the description and the 'Users Interact' content-rating answer."
      file: apps/watch/wearApp/src/main/kotlin/app/gauge/wear/ui/CouplesScreen.kt
    IMPORTANT: >
      Play requires screenshots to depict the actual in-app experience. Every
      one of these must be a real capture of the real build. No renders, no
      mockups, no composited watch bezels.
