    # https://arborfam-hub.web.app/privacy for the phone app; the watch reaches
    # them only by way of the same backend.
    - name: "Deepgram"
      role: "Speech-to-text for the audio the watch uploads, once the server analyses a captured session."
      receives: "The watch's uploaded microphone audio, by way of the MindShift server."
      proof: [server/audio_pipeline.py:106, server/audio_ingest.py:48, server/watch/post_session.py]
    - name: "Anthropic (Claude)"
      role: "Generates the post-session analysis from the transcript."
      receives: "Transcript text derived from the watch's audio. Never heart rate, never the audio itself."
      proof: [server/llm_client.py:474-479,638-650, server/watch/post_session.py]
    - name: "Google (Firebase Authentication)"
      role: "Identity. The watch never touches Firebase directly — it exchanges a pairing code for an opaque device token, and the server verifies Firebase tokens on the phone side of that exchange."
      receives: "Nothing from the watch itself."
      proof: [server/watch/auth.py:119-153, apps/watch/wearApp/src/main/kotlin/app/gauge/wear/auth/DevicePairingClient.kt:26-29]
    - name: "Google Cloud (Cloud Run, Cloud Storage, Firestore)"
      role: "Runs the MindShift backend and stores everything the watch uploads."
      receives: "Live-session documents (including base64 PCM and the heart-rate series), capture audio blobs, telemetry events."
      proof: [scripts/deploy_cloudrun.sh:126-131, server/watch/store.py:54-83, server/watch/routers/captures.py:174-199]
    - name: "Google (Wear Health Services)"
      role: "The platform API that supplies the heart-rate stream. On-device, part of the OS."
