      proof: [apps/watch/wearApp/src/main/kotlin/app/gauge/wear/sensors/HrSource.kt:1-20]
  third_parties_the_phone_uses_that_the_watch_does_not:
    - "Cloudflare TURN — the watch has no WebRTC and makes no calls."
    - "Expo / EAS Update — that is the phone app's OTA channel; the watch is a plain Android build with no update SDK."

  _judgement_calls:
    - field: "Health and fitness → Health info"
      declared: "Collected (Optional), not shared"
      reasoning: >
        Declared COLLECTED, reversing the phone pack's answer for this listing,
        because the watch reads a body sensor and transmits the reading off the
        device. Even under the narrowest reading of Play's definition, a
        continuously sampled heart rate stored per session is health
        information. Declared NOT SHARED because it reaches no third party and
        no other user. Declared OPTIONAL because BODY_SENSORS can be denied and
        the app keeps working.
    - field: "Device or other IDs"
      declared: "Collected (Required), not shared"
      reasoning: >
        An app-minted install UUID is arguably not what Play means by "device
        id" (its examples are IMEI, MAC, Widevine, Firebase installation id,
        advertising id). But it is an identifier for this install, it is
        transmitted on every telemetry batch, and over-declaring costs nothing.
        The separate advertising-id question remains a clean No.
    - field: "Store listing category"
      declared: "Communication"
      reasoning: >
        Deliberately NOT "Health & Fitness" even though heart rate is read.
        Health categories pull the app into Play's Health apps declaration and
        health-content policy, which is the wrong regime for a conversation
        coach that happens to use a pulse as one input. The heart rate is never
        surfaced as a health metric, there is no trend view, no resting-rate
        report, no medical claim anywhere in the UI.
    - field: "Audio declared Required rather than Optional"
      declared: "Required"
      reasoning: >
        Arming the sentinel in any mic mode streams audio on trigger; the wearer
        cannot use the core feature and decline the upload. COMPANION mode
        avoids the mic entirely, but a mode switch is not what Play means by
        "users can choose whether it's collected".
    - field: "Messages / Other in-app messages"
      declared: "Not collected"
      reasoning: >
        Unlike the phone, the watch never produces, receives or renders
        conversation text. The transcript is derived server-side from the
        uploaded audio and is declared under the phone listing, where the text
        actually reaches a device.

  _open_risks_the_owner_should_know_about:
    - risk: >
        UNPAIRED AUDIO GOES TO A SHARED ACCOUNT ID. With no device token stored,
        the watch opens the episode socket as `?account=default`, and the server
        accepts it because MINDSHIFT_ALLOW_LEGACY_ACCOUNT defaults to true and the
        Cloud Run deploy does not override it. The resulting live-session document
        — including its base64 PCM and its heart-rate series — is owned by the
        literal account id "default", which belongs to no user. Two consequences:
        (a) DELETE /me can never reach it, so a person who used the watch before
        pairing cannot delete that audio; (b) POST /me/claim-legacy lets the FIRST
        account that calls it adopt the whole "default" history, so on a multi-user
        backend one account could claim another person's pre-pairing recordings.
        This is the single most Play-relevant thing in the watch codebase. It is
        not a blocker for the declarations in this pack — they describe it
        honestly — but it should be closed before the listing goes live, by
        setting MINDSHIFT_ALLOW_LEGACY_ACCOUNT=false on Cloud Run and requiring
        pairing before the socket opens.
      proof:
        - server/watch/auth.py:149-153
        - server/watch/config.py:16-19
        - scripts/deploy_cloudrun.sh:130-131
        - server/watch/routers/rest.py:360-378
    - risk: >
        THE PRIVACY POLICY DOES NOT MENTION HEART RATE, and it does not mention
        the watch's microphone audio as a source. https://arborfam-hub.web.app/privacy
        names microphone audio, transcripts, voiceprints, video and diagnostics,
        and it mentions the watch only as a pairing and a telemetry source. A Data
        safety declaration that says "Health info: collected" while the linked
        policy is silent about it is exactly the mismatch the README warns about.
        The policy must gain a heart-rate paragraph in the same commit that
        submits this form.
      proof:
        - apps/mobile/public/privacy/index.html:245-247,372,387
    - risk: >
        THE PRIVACY POLICY IS ALSO STALE ABOUT LIVE AUDIO, for both listings. It
        says a live coaching session "keeps no audio at all" and that the server
        "never writes that audio down". Both statements were true when it was
        written and are no longer: the phone keeps live audio by default
        (DEFAULT_KEEP_AUDIO = true) and the watch's live PCM is persisted as
        pcm_b64 on the live-session document. Fix the page before submitting
        either app's Data safety form.
      proof:
        - apps/mobile/public/privacy/index.html:114-115,195-198
        - apps/mobile/src/live/keepAudioPrefs.ts:21
        - server/watch/routers/ws.py:316
    - risk: >
        WATCH TELEMETRY IS NOT DELETABLE. It is keyed to a per-install UUID and
        carries no account id, so DELETE /me's diagnostics tier (which deletes by
        data.uid) cannot find it. Already disclosed on the /delete-account page;
        listed here so it is not rediscovered as a surprise.
      proof:
        - apps/watch/wearApp/src/main/kotlin/app/gauge/wear/telemetry/Telemetry.kt:64-68
        - server/account_deletion.py:336-352
    - risk: >
        NO RETENTION LIMIT on watch live sessions or on manually saved captures.
        Journal captures are the only thing in the repo with a real TTL (48 h).
        Everything else lives until the user deletes it, which is what the policy
        says, and is true.
      proof:
        - server/watch/journal.py:80,146-178
    - risk: >
        A DEBUG BUILD WITH A DIFFERENT PACKAGE ID EXISTS (com.sagearbor.gauge.wear.debug,
        labelled "MindShift Dev"). It is not published and cannot be — it is
        debug-signed — but if a reviewer ever sees that id in a bug report, this is
        what it is.
      proof:
        - apps/watch/wearApp/build.gradle.kts:50-78

