_schema:
  what_this_is: >
    A complete, pre-decided answer pack for the Google Play Console "Set up your
    app" checklist for com.sagearbor.mindshift.app. There is no Play API for this
    checklist, so a browser agent (Claude in Chrome / Cowork) drives the forms.
    This file exists so that agent never has to guess, never has to stop and ask,
    and never invents an answer that contradicts what the code actually does.
  how_to_use: >
    Walk it top to bottom. Each section maps to one left-nav item in Play Console
    under "Policy → App content" or "Grow → Store presence → Main store listing".
    Every leaf value is the literal thing to type or the literal option to click.
    Where a field cannot be answered without the owner (credentials, uploads,
    a human judgement call), the value is the string OWNER_MUST_SUPPLY and the
    sibling `owner_action` says exactly what is needed. Never invent a value for
    an OWNER_MUST_SUPPLY field.
  key_conventions:
    - "`value:` is what to enter/select."
    - "`why:` is the justification — paste it into a Play appeal if one is ever needed."
    - "`proof:` is a file:line in this repo that makes the claim checkable."
    - "OWNER_MUST_SUPPLY means: stop, leave the field blank, report it, move on."
  verified_against_commit: f04a5c1  # origin/main, 2026-08-25 (+ the account-deletion branch)
  last_updated: 2026-08-26
  authored_by: Claude (agent), from a full read of server/ and apps/mobile/

app_identity:
  package_name: com.sagearbor.mindshift.app
  proof: apps/mobile/app.json:29
  play_developer_account: "7699975610134980668 (Sage Arbor)"
  app_already_exists_in_console: true
  note: >
    The Play app record already exists (versionCode 31 / 1.16.0 was uploaded by
    hand). This pack completes the "Set up your app" declarations only — it does
    NOT ship a release. See docs/plans/2026-08-24-realtime-three-tracks-handoff.md §9.
  current_version: "1.18.0 (versionCode 34)"
  proof_version: apps/mobile/app.json:5,30

# ===========================================================================
# 1. App access  (Policy → App content → App access)
# ===========================================================================
app_access:
  question: "Is all or some functionality of your app restricted?"
  value: "All or some functionality is restricted"
  why: >
    The app is a hard login gate. An unauthenticated user only ever sees the
    login screen — there is no guest mode, no anonymous Firebase sign-in, and no
    "skip" branch anywhere in the client.
  proof:
    - apps/mobile/App.tsx:416-425   # auth gate: `if (!user) return <LoginScreen/>`
    - apps/mobile/src/screens/LoginScreen.tsx:26-49  # email+password / Google / Apple only
  instructions_block:
    name: "Full app — demo account"
    # Play shows this text verbatim to the reviewer. Keep it short and literal.
    value: |
      MindShift requires a free account. Sign in on the first screen with the
      demo credentials below (email + password — do NOT use "Continue with
      Google", it is tied to a real person's account).

      After sign-in you land on Home. To exercise the core feature:
        1. Tap "Live Coach".
        2. Grant the microphone and speech-recognition permissions when asked.
        3. Tap Start and speak for ~20 seconds (any speech is fine). Coaching
           suggestions appear on screen within a few seconds.
        4. Tap Stop. The session appears under "Your Day" / "Recordings".

      The in-app Call feature needs a second signed-in account and is not
      required to evaluate the app.
    username: OWNER_MUST_SUPPLY
    password: OWNER_MUST_SUPPLY
  owner_action: >
    Create a throwaway Firebase email/password account in the arborfam-hub
    project (Firebase Console → Authentication → Users → Add user), e.g.
    play-review@<something you control>. Do NOT hand Play a real account: any
    reviewer who signs in can see that account's stored recordings, transcripts
    and voiceprints. The agent must not invent credentials.
  any_other_instructions: "No"

# ===========================================================================
# 2. Ads  (Policy → App content → Ads)
# ===========================================================================
ads:
  question: "Does your app contain ads?"
  value: "No, my app does not contain ads"
  why: >
    There is no advertising, attribution or analytics SDK of any kind. The full
    dependency list contains no AdMob / react-native-google-mobile-ads, no
    Facebook SDK, AppsFlyer, Adjust, Branch, Segment, Amplitude, Mixpanel,
    OneSignal, Sentry, Crashlytics or @react-native-firebase/analytics. The one
    "sentry" string in the repo is inside a Jest transformIgnorePatterns regex
    with no matching dependency. The manifest does not request
    com.google.android.gms.permission.AD_ID, and no advertising identifier is
    ever read.
  proof:
    - apps/mobile/package.json:14-51  # complete dependency list
    - apps/mobile/package.json:68     # the "sentry" string — a Jest regex, not a dep
    - apps/mobile/app.json:31-40      # android.permissions — no AD_ID
    - apps/mobile/src/auth/firebase.ts:1-12  # firebase/app + firebase/auth ONLY, no getAnalytics
  note_for_the_agent: >
    Play will separately ask whether the app has ads in the Data safety
    "Advertising or marketing" purpose. Answer no there too — nothing is
    collected for advertising.

# ===========================================================================
# 3. Content rating  (Policy → App content → Content ratings → IARC questionnaire)
# ===========================================================================
content_rating:
  email_address: sagearbor@gmail.com
  category:
    value: "Utility, Productivity, Communication, or Other"
    why: >
      MindShift is a communication tool: it coaches you during a conversation and
      hosts audio calls. It is not a game, not social networking (there is no
      feed, no profiles, no discovery, no stranger-to-stranger contact — you can
      only talk to someone whose email you already know or who has your join
      code), not dating, not entertainment, not a news/reference app.
    if_that_exact_label_is_absent: >
      IARC wording drifts. Pick the option whose text contains "Utility",
      "Productivity" or "Communication". Do NOT pick "Social Networking" (no
      public profiles or discovery) and do NOT pick "Games".
    proof:
      - server/calls.py:15-21          # peer-to-peer audio calls, closed invite/code
      - docs/plans/2026-08-25-in-app-calls.md:59-83  # join by invited email or 6-char code

  violence:
    answer_to_every_question_in_this_section: "No"
    questions:
      - question: "Does the app contain violence (realistic, cartoon, fantasy) or references to violence?"
        value: "No"
      - question: "Does the app contain graphic depictions of blood, gore, or mutilation?"
        value: "No"
      - question: "Does the app depict or reference torture, killing, or harm to identifiable human beings?"
        value: "No"
      - question: "Does the app glamorize or trivialize the use of weapons?"
        value: "No"
    why: >
      The app ships no authored content of any kind beyond its own UI and
      AI-generated coaching text whose system prompt is a de-escalation /
      empathy stance. It renders the user's own conversation back to them.
    proof:
      - server/main.py:1079-1134  # empathy_system_prompt — the whole authored content surface

  sexuality:
    answer_to_every_question_in_this_section: "No"
    questions:
      - question: "Does the app contain nudity, partial nudity, or sexually suggestive content?"
        value: "No"
      - question: "Does the app contain references to or depictions of sexual acts?"
        value: "No"
      - question: "Does the app provide access to sexual or erotic material?"
        value: "No"

  language:
    answer_to_every_question_in_this_section: "No"
    questions:
      - question: "Does the app contain profanity, crude humour, or vulgar language?"
        value: "No"
    why: >
      Nothing the app itself authors contains profanity. A user's own transcript
      can obviously contain anything they say, but that is user-generated content
      shown only to that user (and to a therapist they deliberately invited) — it
      is declared under the user-interaction question below, which is where IARC
      handles UGC. Do NOT answer "Yes" here; that question is about content the
      developer ships.

  controlled_substance:
    answer_to_every_question_in_this_section: "No"
    questions:
      - question: "Does the app contain references to, or depictions of, alcohol, tobacco, or drugs?"
        value: "No"

  gambling_and_contests:
    answer_to_every_question_in_this_section: "No"
    questions:
      - question: "Does the app contain gambling, simulated gambling, or contests?"
        value: "No"
      - question: "Does the app allow real-money gambling or wagering?"
        value: "No"

  miscellaneous:
    - question: >
        Does the app natively allow users to interact or exchange content with
        other users (chat, voice/video communication, sharing images, audio or
        video)?
      value: "Yes"
      why: >
        Two real user-to-user features. (1) In-app calls: peer-to-peer WebRTC
        audio between 2-3 invited members, with each member's live transcript
        relayed to the others through the server. (2) Therapist sharing: a user
        can name a therapist by email, which grants that account read access to
        the user's session transcripts, analysis AND playback of any stored
        audio/video for those sessions.
      proof:
        - server/calls.py:15-21                     # P2P audio, server relays signaling only
        - server/audio_pipeline.py:2269-2273        # each member's turns pushed to the other sockets
        - server/routers/therapist.py:113-142       # PUT /therapist/link — name a therapist by email
        - server/main.py:3796-3830                  # media_url minted for a share recipient (they can play the audio)
    - question: >
        Do those interactions happen with users the person does not know / can
        strangers contact each other?
      value: "No"
      why: >
        There is no discovery, no directory, no public profile and no matching.
        A call reaches you only if the host typed your account email or handed
        you a 6-character join code out of band; a therapist link is created by
        the patient typing the therapist's account email, and the therapist must
        already have a MindShift account (unknown emails are a 404).
      proof:
        - server/routers/therapist.py:113-142       # 404 when the email has no account
        - docs/plans/2026-08-25-in-app-calls.md:59-83
      if_the_form_only_offers_a_single_yes_no: >
        Answer Yes to "users can interact", then answer the follow-ups honestly:
        moderation = none (there is no public surface to moderate), user
        reporting = not applicable (no strangers), location sharing = No.
    - question: "Does the app share the user's current physical location with other users?"
      value: "No"
      why: >
        No location permission is requested and no location library is
        installed — there is no expo-location, no Geolocation call anywhere.
      proof:
        - apps/mobile/app.json:31-40   # android.permissions: no ACCESS_*_LOCATION
        - apps/mobile/package.json:14-51  # no expo-location
    - question: "Does the app allow users to purchase digital goods?"
      value: "No"
      why: "There is no billing library, no IAP, no subscription code path."
      proof: apps/mobile/package.json:14-51
    - question: "Does the app contain any content or links that take the user to a website outside the app?"
      value: "Yes"
      why: >
        Two outbound links exist: the Wear OS companion's Play Store listing
        (opened with Linking.openURL from Watch Setup), and the share sheet /
        call-invite link, which points at the app's own web build. The user can
        also paste an arbitrary media URL into the Analyze screen for the server
        to fetch.
      proof:
        - apps/mobile/src/screens/WatchSetupScreen.tsx:21-22,140
        - apps/mobile/src/live/call/invite.ts:59
    - question: "Does the app collect or share the user's personal information?"
      value: "Yes"
      why: "See the data_safety section below — audio, transcripts, email, voiceprints."
    - question: "Is the app a 'news' app?"
      value: "No"
    - question: "Does the app enable digital purchases of real-world goods or services?"
      value: "No"
    - question: "Is the app designed for or targeted at children?"
      value: "No"
      why: "See target_audience below — 18+ only."

  expected_result:
    value: "Expected: IARC 'Everyone' / PEGI 3 / ESRB Everyone, with a 'Users Interact' interactive element."
    note: >
      The "Users Interact" descriptor is EXPECTED and correct — it comes from the
      call/sharing answer above. Do not go back and change answers to make it
      disappear.

  agent_stop_rule:
    value: "STOP at the review/summary screen. Do NOT press Submit."
    why: >
      A submitted rating is what unlocks a release, and this pack is explicitly
      not authorised to publish anything. Fill every answer, screenshot the
      summary, and hand it to the owner to press Submit.

# ===========================================================================
# 4. Target audience and content  (Policy → App content → Target audience)
# ===========================================================================
target_audience:
  age_groups_selected:
    value: ["18 and over"]
    why: >
      The app records real conversations, builds a biometric voiceprint of the
      user's voice, and is positioned for couples therapy. It is intended for
      adults. Selecting only 18+ keeps the app out of the Families policy
      programme and out of Teacher Approved review — which is correct, because
      nothing here is designed for or appealing to minors.
    proof: PRD.md:26-33   # target users: therapists, therapy patients, couples
  do_not_select: ["Ages 5 and under", "Ages 6-8", "Ages 9-12", "Ages 13-15", "Ages 16-17"]
  store_presence_appeals_to_children:
    question: "Could your store listing unintentionally appeal to children?"
    value: "No"
    why: >
      The icon, feature graphic and screenshots are muted indigo/sage adult
      design; the copy is about couples and therapists. No cartoon characters,
      no bright primary-colour play imagery, no child actors, no toys or games.
  ads_shown_to_children:
    value: "Not applicable — the app has no ads."
  designed_for_families:
    value: "No"
  known_child_users:
    question: "Do you have any known users under the target age?"
    value: "No"
  google_play_families_policy:
    value: "Not opted in."
  news_app:
    value: "No"
  covid_19_contact_tracing_or_status:
    value: "No"
  data_safety_child_note: >
    Because 18+ is the only selected age group, Play will not ask for a Families
    Ads SDK declaration or a Teacher Approved submission. If the console still
    shows those, the age selection did not save — re-check it.

# ===========================================================================
# 5. Data safety  (Policy → App content → Data safety)
# ===========================================================================
data_safety:
  _reading_note: >
    Play's "Shared" has a narrow definition that EXCLUDES transfers to a service
    provider processing on your behalf, and transfers triggered by a specific
    user-initiated action. Under a strict reading, Deepgram/Anthropic (processors)
    and therapist sharing (user-initiated) would both be "not shared". This pack
    deliberately declares them as SHARED anyway. Over-declaring is never an
    enforcement risk; under-declaring is exactly how apps get flagged, and the
    privacy policy at https://arborfam-hub.web.app/privacy names all of them by
    company. Keep the two consistent — if you ever change one, change the other.

  overview:
    does_your_app_collect_or_share_any_of_the_required_user_data_types:
      value: "Yes"
    is_all_of_the_user_data_collected_by_your_app_encrypted_in_transit:
      value: "Yes"
      why: >
        Every network hop is TLS. The API is Cloud Run (HTTPS only; the service
        URL is https:// and the app derives wss:// from it). The live audio
        socket is wss://. Outbound to Deepgram is wss:// with certificate
        verification explicitly enforced in code, and https:// for uploads. The
        Anthropic and Cloudflare calls are https://. In-app call media is
        WebRTC, which is DTLS-SRTP encrypted by the platform stack and never
        traverses the MindShift server.
      proof:
        - scripts/deploy_cloudrun.sh:210-228        # Cloud Run managed; wss derived from https
        - apps/mobile/src/hooks/useAudioStream.ts:67-70,1230  # WS_BASE = API_URL with http→ws
        - server/audio_pipeline.py:81-92,106        # wss://api.deepgram.com + cert verification enforced
        - server/audio_ingest.py:48                 # https://api.deepgram.com/v1/listen
        - server/calls.py:15-21,274-276             # P2P media; https Cloudflare TURN mint
    do_you_provide_a_way_for_users_to_request_that_their_data_is_deleted:
      value: "Yes"
      deletion_url: "https://arborfam-hub.web.app/delete-account"
      account_deletion_is_self_serve: true
      why: >
        FULL ACCOUNT DELETION IS SELF-SERVE AND IMMEDIATE. Settings → Account →
        "Delete my account" lists exactly what will go, requires the user to
        type DELETE, then calls DELETE /me, which erases every tier of stored
        data for the authenticated uid and finally deletes the Firebase Auth
        user itself. No email, no waiting period, no human in the loop; the
        user is signed out on success. The same control is in the web build
        (one Expo codebase — react-native-web), so a browser-only user has the
        identical path. Play's required "delete account" path and its optional
        "delete some data" path are BOTH satisfied: partial deletes (one
        recording, the voiceprint, one enrolled person, one voice sample, one
        share grant, the therapist link, an in-progress upload) all still exist
        as their own in-app actions.
      deletion_scope: >
        DELETE /me erases, for the caller's uid only: recordings/{uid}/ (audio,
        360p video, transcripts, analysis, titles, speaker labels); every share
        grant on those episodes plus the recipients' reverse-index objects;
        shared/{uid}/ (grants others made to the user), revoked on the owner's
        side too; voiceprints/{uid}/ (self, every named person, and the legacy
        layout); uploads/{uid}/; jobs/{uid}/; therapist_links/{uid}/ and
        therapist_patients/{uid}/ with the counterpart rows on the other
        account; therapist_notes/{uid}/; the notes OTHER accounts wrote about
        this user's episodes; the Firestore live_sessions / baselines /
        subscriptions / accounts / speaker_profiles / captures (blob first,
        then doc) / groups membership / device_tokens / pairings /
        failed_claim_attempts / diagnostics telemetry docs keyed to the uid;
        the SQLite sessions + relationships (+ participants, voice_profiles)
        rows; and last of all the Firebase Auth user.
      shared_data_rule: >
        A session the user shared with a therapist is still the USER'S — sharing
        grants a view, never ownership — so account deletion deletes the session
        itself and every grant on it, and the therapist's private notes ABOUT
        THAT SESSION go with it (a note is an annotation on the patient's
        content; keeping it would leave a record of the conversation under
        another account). Notes that therapist wrote on anyone else's sessions,
        and every other part of their account, are untouched. The same wording
        is in the privacy policy and on the /delete-account page.
      not_reachable_by_deletion: >
        Videos the app also saved to the user's own phone photo library (their
        device, their copy); anything another person exported or screenshotted;
        Cloud Run operational logs (timestamps, status codes, request ids,
        account identifiers — never transcripts/audio/analysis) until they
        rotate; watch-sent telemetry, which is keyed to a device id and carries
        no account id at all. All three are stated on the /delete-account page
        and in the privacy policy.
      safety_guards: >
        The endpoint acts ONLY on the uid in the verified token — nothing in the
        path, query or body names an account, so a therapist can never delete a
        patient nor vice versa. It requires a FRESHLY ISSUED ID token
        (auth.get_fresh_uid, default 10-minute window; the client force-
        refreshes via getIdToken(true)) so a stale captured token cannot replay
        it, a body of exactly {"confirm": "DELETE"} (422 otherwise), and has its
        own per-IP rate limit of 3/min. Every deletion is logged at INFO with
        the uid, the per-category counts and the elapsed time.
      proof:
        - server/routers/account.py                 # DELETE /me — guards, rate limit, logging
        - server/account_deletion.py                # the tier walk + the documented scope/rules
        - server/auth.py:159-235                    # get_fresh_uid + delete_firebase_user (called LAST)
        - server/recordings_store.py:1290-1440      # the uid-scoped bulk-delete surface
        - server/watch/store.py                     # delete_baseline/subscriptions/account/speaker_profile/group
        - server/watch/pairing_store.py             # delete_pairings_for_account, delete_failed_claim_record
        - server/watch/telemetry_store.py           # delete_events_for_account (data.uid)
        - server/tests/test_account_deletion.py     # full walk, idempotency, confirm guard, scoping, ordering
        - apps/mobile/src/api/account.ts            # force-refreshed token + typed confirmation
        - apps/mobile/src/screens/AdvancedScreen.tsx  # Settings → Account → Delete my account
        - apps/mobile/__tests__/DeleteAccount.test.tsx
        - server/main.py:3707-3720                  # DELETE /recordings/{id}
        - server/main.py:3776-3794                  # DELETE /recordings/{id}/shares/{uid}
        - server/routers/voice.py:1055-1067         # DELETE /voice/voiceprint  ("Forget my voice")
        - server/routers/voice.py:1077-1093         # DELETE /voice/people/{id}
        - server/routers/voice.py:1009-1045         # DELETE /voice/samples/{id}
        - server/routers/therapist.py:160-164       # DELETE /therapist/link
        - server/watch/routers/rest.py:513-526      # DELETE /live-sessions/{id}
        - server/watch/routers/captures.py:227-257  # DELETE /captures/{id} — blob then doc
        - apps/mobile/src/screens/RecordingsScreen.tsx:126
      owner_action_remaining: >
        The email fallback on the /delete-account page is now only for someone
        who can no longer sign in. The owner must still honour those — but they
        should be rare, and the in-app path is what Play's URL check will find
        described first.
    data_types_not_collected_at_all:
      - "Location (approximate and precise)"        # no location lib, no permission
      - "Financial info (all)"                      # no billing, no payments
      - "Health and fitness (all)"                  # see _judgement_calls below
      - "Emails / SMS or MMS"                       # never read
      - "Photos"                                    # the avatar selfie stays in on-device SecureStore
      - "Contacts / Calendar"                       # no library, no permission
      - "Web browsing history"
      - "Installed apps"                            # getSpeechRecognitionServices() is a local probe, never transmitted
      - "In-app search history"
      - "Device or other IDs"                       # no ad ID, no Android ID, no Firebase installation ID

  # -------- the matrix. One block per Play data type that IS declared. -------
  data_types:

    - play_path: "Personal info → Name"
      collected: true
      shared: true
      processed_ephemerally: false
      required_or_optional: "Optional — users can choose whether it's collected"
      purposes: ["App functionality", "Account management"]
      what_it_actually_is: >
        The Firebase account display name (populated when the user signs in with
        Google), a self-declared display name a user may type when starting or
        joining a call, and the names a user attaches to voices ("Mom", "Alex").
      why_shared: >
        Call members see each other's display names, and a therapist who is
        granted an episode sees the speaker labels the patient set.
      proof:
        - apps/mobile/src/store/authStore.ts:62            # {uid, email, displayName} held client-side
        - server/calls.py:1122-1132                        # display names persisted as episode speaker labels
        - server/recordings_store.py:202-227               # meta.json manual_speaker_labels / manual_speaker_people

    - play_path: "Personal info → Email address"
      collected: true
      shared: true
      processed_ephemerally: false
      required_or_optional: "Required"
      purposes: ["App functionality", "Account management"]
      what_it_actually_is: >
        The account's sign-in email. Stored server-side inside therapist links,
        inside every share grant, and in the watch-domain account record. Also
        included verbatim in the auto-sent diagnostics report.
      why_shared: >
        A therapist sees the patient's email on shared sessions and vice versa,
        and a patient names their therapist BY email.
      proof:
        - server/auth.py:83-104,107-122                    # resolve_uid_by_email / resolve_email_by_uid
        - server/therapist_links.py:58-67                  # patient_email + therapist_email persisted
        - server/recordings_store.py:895-899,907-912       # share grant + reverse index carry emails
        - server/routers/sessions.py:713-744               # shared rows labelled with the owner's email
        - apps/mobile/src/diagnostics/diagnostics.ts:164-201,210-225  # email inside the diagnostics payload

    - play_path: "Personal info → User IDs"
      collected: true
      shared: true
      processed_ephemerally: false
      required_or_optional: "Required"
      purposes: ["App functionality", "Account management", "Fraud prevention, security, and compliance"]
      what_it_actually_is: >
        The Firebase Auth uid. It is the tenancy key for literally everything —
        every stored object lives under recordings/{uid}/ or voiceprints/{uid}/,
        which is what makes it impossible for one account to read another's data.
      why_shared: >
        A share recipient's client receives the owner's uid in the
        "shared with me" listing.
      proof:
        - server/auth.py:69-80                             # verify_id_token -> uid
        - server/recordings_store.py:29-32                 # every read/write/delete scoped under recordings/{uid}/
        - server/recordings_store.py:851-859               # shared/{recipient_uid}/{owner_uid}:{rid}.json
        - server/main.py:3232-3264                         # GET /recordings returns shared_with_me

    - play_path: "Personal info → Other info"
      collected: true
      shared: false
      processed_ephemerally: false
      required_or_optional: "Optional — users can choose whether it's collected"
      purposes: ["App functionality", "Personalization"]
      what_it_actually_is: >
        THE VOICEPRINT. A 192-number ECAPA-TDNN speaker embedding — a biometric
        identifier — computed from the user's (or an enrolled person's) speech
        and stored as JSON in Google Cloud Storage under voiceprints/{uid}/.
        Play's Data safety form has no "biometrics" category, so it belongs
        here; the privacy policy names it explicitly. The raw audio it was
        derived from is NOT kept for the guided-clip path.
      why_not_shared: >
        The embedding is never sent to Deepgram, Anthropic, or any other third
        party — nothing in audio_pipeline.py or llm_client.py puts an embedding
        into an outbound provider payload. The only place it leaves the server is
        back to the enrolling account's own phone, on an explicit
        include_embeddings=true request, so the phone can match speakers locally.
      user_can_delete: >
        Yes — Settings → Voice → Forget my voice, plus per-person and per-sample
        deletes, and Settings → Account → Delete my account removes every
        enrolled person's voiceprint (self, named partners, and the legacy
        single-document layout) as part of erasing the whole account.
      proof:
        - server/speaker_id.py:52,245-266                  # EMBEDDING_DIM = 192; embed_pcm -> l2_normalize
        - server/recordings_store.py:1018-1023,1048-1055   # 'biometric data'; voiceprints/{uid}/{person_id}/profile.json
        - server/routers/voice.py:450-452                  # "a numeric voice signature (192 numbers), not your audio"
        - server/routers/voice.py:559-605                  # include_embeddings=true — uid-scoped, opt-in, to the owner only
        - server/routers/voice.py:1055-1067                # DELETE /voice/voiceprint — real delete, no tombstone
        - apps/mobile/src/live/speakerId.ts:169-186        # phone holds them in memory only, never persisted

    - play_path: "Messages → Other in-app messages"
      collected: true
      shared: true
      processed_ephemerally: false
      required_or_optional: "Required"
      purposes: ["App functionality"]
      what_it_actually_is: >
        The transcript of the user's conversation — the core working material.
        Turns, speaker labels, timings, the tone numbers the phone measured, the
        coaching suggestions generated for them, and any free-text note a
        therapist writes on an episode.
      why_shared: >
        Transcript text is sent to Anthropic (Claude) to generate the coaching
        suggestions — raw and unredacted, with no PII scrubbing. And a therapist
        the user named gets full read access to the transcript and analysis.
      retention_truth: >
        Live sessions keep NOTHING server-side while they run (a bounded
        in-memory list, explicitly not persisted). A transcript becomes stored
        only when the phone POSTs the finished session, or when an upload is
        made with consent. Once stored there is no TTL — it lives until deleted.
      proof:
        - server/audio_pipeline.py:1179-1195               # _turn_prompt — raw text into the Anthropic prompt
        - server/llm_client.py:638-650                     # the Anthropic messages.create request shape
        - server/llm_client.py:474-479                     # client built with api_key/timeout/retries ONLY — no ZDR header
        - server/audio_pipeline.py:1307-1310               # live transcript "Deliberately NOT persisted anywhere"
        - server/recordings_store.py:20-24,248-253         # turns.json + analysis.json in GCS when stored
        - server/main.py:3405-3430                         # a share recipient reads the owner's transcript + analysis
        - server/recordings_store.py:1184-1190             # therapist_notes/{uid}/{episode_id}.json

    - play_path: "Audio files → Voice or sound recordings"
      collected: true
      shared: true
      processed_ephemerally: false
      required_or_optional: "Required"
      purposes: ["App functionality"]
      what_it_actually_is: >
        Microphone audio. During a live session the phone streams raw 16 kHz mono
        PCM to the MindShift server continuously — this happens whether or not the
        "on-device coaching" toggle is on; the on-device loop runs ALONGSIDE the
        upload, not instead of it. Uploaded recordings (files or in-app captures)
        are sent whole. Voice-enrollment clips are uploaded as WAV.
      why_shared: >
        The server streams that PCM to Deepgram (wss://api.deepgram.com/v1/listen,
        model nova-3, diarize=true) for transcription; uploads are POSTed to
        Deepgram's prerecorded endpoint. Coaching text (not user audio) is also
        POSTed to Deepgram Aura for text-to-speech. A therapist granted an episode
        can PLAY BACK its stored audio, not just read it.
      what_is_actually_kept: >
        Live audio is never written to disk anywhere on the server — the only
        retention is a 90-second in-memory ring buffer that dies with the socket.
        Uploads are process-and-discard unless the user ticks consent AND storage
        is enabled, and even then only a compressed AAC derivative is kept, never
        the original bytes. The watch domain is the exception: it stores raw PCM
        (captures/{account}/{id}.pcm in GCS, and base64 PCM inside Firestore
        live_session docs).
      proof:
        - apps/mobile/src/hooks/useAudioStream.ts:932,960-964,1230  # PCM to the WS on every live session
        - apps/mobile/src/hooks/useAudioStream.ts:1843-1875         # streaming starts unconditionally; fast loop starts after
        - server/audio_pipeline.py:106-117,432-437,470              # Deepgram live: URL, auth header, ws.send(audio)
        - server/audio_ingest.py:48-61,528-539                      # Deepgram prerecorded: URL, params, payload
        - server/audio_pipeline.py:125-126,762-767                  # Deepgram Aura TTS (coaching text)
        - server/audio_pipeline.py:183,946-1016                     # PcmRingBuffer, 90 s, in-memory, dies with the connection
        - server/main.py:2830-2836,2945,3131-3135                   # triple-gated storage; consent defaults false
        - server/recordings_store.py:17-18,238-244                  # derivatives only, never the original bytes
        - server/routers/sessions.py:556-562                        # live episodes: media_type "none", "no audio kept"
        - server/watch/routers/captures.py:85-88,190                # captures/{account}/{id}.pcm — RAW PCM at rest
        - server/watch/store.py:37,56-84                            # pcm_b64 raw audio inside the Firestore doc
        - apps/mobile/src/api/client.ts:2031                        # POST /voice/enroll-direct (WAV upload)
        - server/main.py:3796-3830                                  # a share recipient gets a playback token for the OWNER's media

    - play_path: "Photos and videos → Videos"
      collected: true
      shared: true
      processed_ephemerally: false
      required_or_optional: "Optional — users can choose whether it's collected"
      purposes: ["App functionality"]
      what_it_actually_is: >
        Video the user records in the app (480p, 10-minute cap) or picks from
        their device, uploaded for analysis. It is also written to the user's own
        camera roll, which is a local action, not collection.
      why_shared: >
        The upload path sends a 16 kHz WAV downmix to Deepgram — but when ffmpeg
        cannot produce that downmix it falls back to POSTing the ORIGINAL
        container bytes, i.e. the video itself, to Deepgram. And a therapist
        granted the episode can play the stored 360p derivative.
      optional_because: >
        Video is only involved if the user chooses to record or upload one. The
        live coaching path never touches the camera; in-app calls are audio-only.
      proof:
        - apps/mobile/src/screens/RecordScreenNative.tsx:113,270-323  # 480p capture; MediaLibrary.Asset.create
        - apps/mobile/src/api/client.ts:663,867,887                   # /analyze/upload and the chunked path
        - server/audio_ingest.py:451-470,528-534                      # downmix, else the original container bytes go to Deepgram
        - server/recordings_store.py:241-244                          # video_360p.mp4 derivative only
        - apps/mobile/src/live/call/callSession.ts:22-25              # calls are audio-only

    - play_path: "App activity → Other user-generated content"
      collected: true
      shared: true
      processed_ephemerally: false
      required_or_optional: "Optional — users can choose whether it's collected"
      purposes: ["App functionality", "Personalization"]
      what_it_actually_is: >
        Everything the user types or configures around a session: session titles,
        the names attached to voices, the relationship/role configuration, the
        empathy-slider setting, and a therapist's private free-text notes on an
        episode (capped at 5000 chars).
      why_shared: "Speaker labels and titles travel with an episode a therapist is granted."
      proof:
        - server/recordings_store.py:202-227                # meta.json: title, manual_speaker_labels, source
        - server/main.py:836-848                            # voice_profiles (suggestion/rephrase pairs, style_notes)
        - server/therapist_links.py:44                      # note cap 5000 chars
        - server/recordings_store.py:1258-1263              # therapist_notes write

    - play_path: "App activity → App interactions"
      collected: true
      shared: false
      processed_ephemerally: false
      required_or_optional: "Required"
      purposes: ["App functionality", "Analytics"]
      what_it_actually_is: >
        The "last session" record inside the diagnostics report: session mode,
