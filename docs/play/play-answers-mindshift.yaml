      receives: "Email, password/Google credential, display name."
      proof: [apps/mobile/src/auth/firebaseConfig.ts:14-30, server/auth.py:32,69-80]
    - name: "Google Cloud (Cloud Run, Cloud Storage, Firestore)"
      role: "Runs the MindShift backend and stores everything the user chose to keep."
      receives: "Everything stored — audio derivatives, video derivatives, transcripts, analysis, voiceprints, links, notes."
      proof: [scripts/deploy_cloudrun.sh:108-109,126-129,210-221, server/recordings_store.py:53-73]
    - name: "Google / Apple platform speech services"
      role: "On-device transcription on the phone."
      honest_caveat: >
        The app asks for on-device recognition explicitly
        (requiresOnDeviceRecognition: true, and on Android pins the recognizer to
        com.google.android.as, Android System Intelligence). But the recognizer is
        the platform's, not MindShift's, and MindShift cannot contractually
        guarantee the OS never contacts its vendor — the code even treats
        "network" as a restartable recognizer error. Say this plainly rather than
        claiming audio never leaves the device on that path.
      proof: [apps/mobile/src/live/expoStt.ts:50,167-179, apps/mobile/src/live/expoStt.ts:55-62, apps/mobile/app.json:117-120]
    - name: "Cloudflare (Realtime TURN)"
      role: "Relays in-app call audio when a direct peer-to-peer path cannot be established."
      receives: "Encrypted SRTP packets it cannot read, plus connection metadata. No transcripts, no account data."
      proof: [server/calls.py:274-287, env.example:117-123]
    - name: "Expo (EAS Update)"
      role: "Over-the-air app updates."
      receives: "Runtime version, platform, channel, current-update-id and IP, on every app launch."
      proof: [apps/mobile/app.json:11-15]

  _judgement_calls:
    - field: "Health and fitness → Health info"
      declared: "Not collected"
      reasoning: >
        Play defines health info as "information about a user's health, such as
        medical records or symptoms". MindShift stores conversation transcripts
        and communication-quality scores (warmth, defensiveness, escalation) —
        not diagnoses, symptoms, medications or medical records. The product
        explicitly disclaims being a counseling replacement or a medical tool,
        and is not HIPAA-certified.
      counter_argument_the_owner_should_weigh: >
        The app is sold to couples therapists and a therapist can hold clinical
        notes on a patient's episodes. If MindShift ever adds a clinical
        assessment, a diagnosis, or an integration with a medical record, flip
        this to Collected and update the privacy policy in the same change.
      proof: [PRD.md:22, PRD.md:248-254, server/recordings_store.py:1184-1190]
    - field: "Store listing category"
      declared: "Communication"
      reasoning: >
        Deliberately NOT "Health & Fitness" or "Medical". Those categories pull
        the app into Play's Health apps declaration and health-content policy,
        which is the wrong regime for a tool that explicitly is not a medical
        device. "Communication" is honest: the app hosts calls and coaches
        conversations.
    - field: "Sharing with a therapist declared as Shared"
      declared: "Shared = Yes"
      reasoning: "See _reading_note at the top of this section."

  _open_risks_the_owner_should_know_about:
    - >
      Account deletion is now self-serve and immediate (DELETE /me + Settings →
      Account → Delete my account). It is IRREVERSIBLE by design — no soft
      delete, no tombstone, no restore window — which is what the policy and
      the /delete-account page promise, and what Play requires. The email
      fallback on that page survives only for a user who can no longer sign in.
    - >
      No provider-side retention controls are configured: no Anthropic
      zero-data-retention / no-training header (server/llm_client.py:474-479) and
      no Deepgram redact/no_store parameters (server/audio_pipeline.py:107-117,
      server/audio_ingest.py:52-61). Each vendor's account default governs. Both
      vendors' business terms do bar training on API traffic by default; the
      privacy policy says so without over-promising.
    - >
      Stored user content has NO retention limit at all — no bucket lifecycle
      rule, no TTL, no scheduled deletion anywhere in the repo. The policy says
      "until you delete it", which is the truth.
    - >
      POST/GET /telemetry are unauthenticated by design
      (server/watch/routers/telemetry.py:91,115) and the ?account= legacy
      identity bridge is on by default in production
      (server/watch/config.py:13-16, scripts/deploy_cloudrun.sh:130-131). Neither
      changes a Data safety answer, but both are security debt.
    - >
      server/llm_cache.py writes prompt + response text to disk with no TTL
      (server/llm_cache.py:66-69). It is test-only today — no production code
      path imports it — but it ships inside server/ and the Dockerfile copies
      server/. Worth deleting from the image.
    - >
      Deleting a therapist link does NOT revoke episode grants already made
      (server/routers/therapist.py:12-14). The privacy policy states this
      explicitly so the declaration and the behaviour agree.

